# The Windows program: built on every change of desktop/ and published to the DrisPRO cloud,
# so the sign-in page always offers the newest one. Needs the repository secret DRISPRO_PUBLISH_KEY
# (Platform page → The Windows program → Publish by itself).
name: Windows program
on:
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/desktop.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx electron-builder --win nsis --x64 --publish never
      - run: node publish.mjs
        env:
          DRISPRO_PUBLISH_KEY: ${{ secrets.DRISPRO_PUBLISH_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: DrisPRO-Setup
          path: desktop/dist/DrisPRO-Setup-*.exe
          retention-days: 30
