# Builds NexusERP for Windows (desktop/) and puts the installer on a GitHub release.
name: Desktop (Windows)
on:
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/desktop.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build the installer
        run: npx electron-builder --win nsis --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Version
        id: v
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: NexusERP-Setup-${{ steps.v.outputs.version }}
          path: desktop/dist/*.exe
          if-no-files-found: error
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v${{ steps.v.outputs.version }}
          name: NexusERP për Windows ${{ steps.v.outputs.version }}
          body: Instaluesi i NexusERP për Windows. Shkarkoni NexusERP-Setup-${{ steps.v.outputs.version }}.exe dhe hapeni.
          files: desktop/dist/*.exe
          make_latest: true
