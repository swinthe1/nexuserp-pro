# Known weaknesses in the outside libraries the program is built with (npm audit).
# Runs every Monday morning and whenever started by hand; it fails when a high or critical one is found
# in what ships to the clients, so GitHub sends an e-mail.
name: Library audit
on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: What ships to the clients (fails on high or critical)
        run: npm audit --omit=dev --audit-level=high
      - name: Everything, the build tools too (to read, never fails)
        if: always()
        run: npm audit || true
      - name: Desktop program
        if: always()
        working-directory: desktop
        run: npm audit --omit=dev --audit-level=high || true
