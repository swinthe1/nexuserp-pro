# Known weaknesses in the outside libraries the program is built with (npm audit).
# Runs every Monday morning and whenever started by hand; a new high or critical one in what ships to the
# clients turns it red, so GitHub sends an e-mail. (11.11.2026: jspdf 4, zod 4 and react-router 7 closed the known ones.)
name: Library audit
on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: What ships to the clients
        run: npm audit --omit=dev --audit-level=high
      - name: Everything, the build tools too (to read, never fails)
        if: always()
        run: npm audit || true
      - name: Desktop program
        if: always()
        working-directory: desktop
        run: npm audit --omit=dev --audit-level=high || true
