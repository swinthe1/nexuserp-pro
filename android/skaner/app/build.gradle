plugins { id 'com.android.application' }

def ks = new Properties()
def ksFile = rootProject.file('signing.properties')
if (ksFile.exists()) ks.load(new FileInputStream(ksFile))

android {
    namespace 'com.drispro.skaner'
    compileSdk 35
    defaultConfig {
        applicationId 'com.drispro.skaner'
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName '1.1.1'
        resValue 'string', 'launcherName', 'DrisPRO Skaner'
    }
    signingConfigs {
        release {
            storeFile file(ks['storeFile'] ?: 'missing.keystore')
            storePassword ks['storePassword']
            keyAlias ks['keyAlias']
            keyPassword ks['keyPassword']
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.release }
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

