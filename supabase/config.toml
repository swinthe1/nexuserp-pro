# Supabase CLI settings for running DrisPRO on your own computer (`npx supabase start`).
# Docs: https://supabase.com/docs/guides/local-development/cli/config
project_id = "drispro"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

# The demo data is a psql script (it uses psql variables), so the CLI does not load it;
# deploy/windows/setup-local.ps1 (or `npm run db:seed`) does.
[db.seed]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

# Mailpit: catches sign-up and password-reset emails locally
[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:4173"
additional_redirect_urls = ["http://localhost:5173", "http://127.0.0.1:4173", "http://127.0.0.1:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
# local only: new accounts can sign in without clicking an email link
enable_confirmations = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
