# NexusERP on a local server: the app, and the API under the same address.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 60m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

  location = /healthz { access_log off; return 200 "ok"; }
  # where the app finds this server (made by install.sh)
  location = /nexus-config.js { alias /etc/nginx/nexus-config.js; add_header Cache-Control "no-cache"; default_type application/javascript; }

  location /rest/v1/ {
    proxy_pass http://rest:3000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
  }
  location /auth/v1/ {
    proxy_pass http://auth:9999/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /storage/v1/ {
    proxy_pass http://storage:5000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /storage/v1;
  }
  location /realtime/v1/ {
    proxy_pass http://realtime:4000/socket/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host realtime-dev.nexus-realtime;
    proxy_read_timeout 3600s;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  location ~* ^/(sw\.js|workbox-.*\.js|manifest\.webmanifest|index\.html)$ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
