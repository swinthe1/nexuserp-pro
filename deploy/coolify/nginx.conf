server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

  location = /healthz { access_log off; return 200 "ok"; }

  # DrisPRO inside ChatGPT and Claude: https://<the app>/mcp/<key> is handed to the database,
  # which answers the protocol (public.mcp_http). The key is in the address, so it is never logged.
  # __API__ and __ANON__ are filled in when the image is built.
  location ~ "^/mcp/(?<mcp_key>[A-Za-z0-9_]{20,80})/?$" {
    access_log off;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Headers "content-type, accept, mcp-protocol-version, mcp-session-id, authorization" always;
    add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
    if ($request_method = OPTIONS) { return 204; }
    if ($request_method != POST) { return 405; }
    resolver 127.0.0.11 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    set $mcp_api "__API__";
    proxy_pass $mcp_api/rest/v1/rpc/mcp_http;
    proxy_ssl_server_name on;
    proxy_set_header Host $proxy_host;
    proxy_set_header apikey "__ANON__";
    proxy_set_header Authorization "Bearer __ANON__";
    proxy_set_header Content-Type "application/json";
    proxy_set_header Accept "application/json";
    proxy_set_header Cookie "";
    proxy_set_header x-mcp-key $mcp_key;
    proxy_set_header x-app-origin "https://$host";
    proxy_hide_header Access-Control-Allow-Origin;
    client_max_body_size 1m;
    proxy_read_timeout 60s;
  }
  # the links carry their own key: no sign-in screens to discover
  location ^~ /.well-known/oauth { return 404; }
  # the DrisPRO Skaner Android app opens this site full screen (no address bar) only when this file names its signing key
  location = /.well-known/assetlinks.json { default_type application/json; add_header Cache-Control "no-cache"; try_files $uri =404; }
  location = /mcp { return 404 "Make your link in DrisPRO: account menu - DrisPRO in ChatGPT and Claude\n"; }

  # local servers of clients look here every night for a new version
  location = /updates/latest.json { add_header Cache-Control "no-cache"; default_type application/json; try_files $uri =404; }
  location /updates/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }

  # files with a content hash in the name never change
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # the service worker, its manifest and the page itself must always be fresh, so updates arrive
  location ~* ^/(sw\.js|workbox-.*\.js|manifest\.webmanifest|index\.html)$ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # single-page app: every other path opens the app
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
