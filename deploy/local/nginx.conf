# DrisPRO on a local server: the app, and the API under the same address.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 60m;
  # Docker's name service, asked again every 10 s: a service that restarted (new address) is found at once
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $rest http://rest:3000;
  set $auth http://auth:9999;
  set $storage http://storage:5000;
  set $realtime http://realtime:4000;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

  location = /healthz { access_log off; return 200 "ok"; }
  # where the app finds this server (made by install.sh)
  location = /drispro-config.js { alias /etc/nginx/drispro-config.js; add_header Cache-Control "no-cache"; default_type application/javascript; }

  location /rest/v1/ {
    rewrite ^/rest/v1/(.*)$ /$1 break;
    proxy_pass $rest;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
  }
  location /auth/v1/ {
    rewrite ^/auth/v1/(.*)$ /$1 break;
    proxy_pass $auth;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /storage/v1/ {
    rewrite ^/storage/v1/(.*)$ /$1 break;
    proxy_pass $storage;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /storage/v1;
  }
  location /realtime/v1/ {
    rewrite ^/realtime/v1/(.*)$ /socket/$1 break;
    proxy_pass $realtime;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host realtime-dev.drispro-realtime;
    proxy_read_timeout 3600s;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  location ~* ^/(sw\.js|workbox-.*\.js|manifest\.webmanifest|index\.html)$ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
