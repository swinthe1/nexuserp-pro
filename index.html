<!doctype html>
<html lang="sq" suppressHydrationWarning>
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="description" content="DrisPRO — shitje, magazinë, blerje, prodhim, financë dhe paga në një vend." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="DrisPRO" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2B59C3" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>DrisPRO</title>
    <script src="/drispro-config.js"></script>
    <script>
      // settings saved under the older name (NexusERP) are kept once under the new one
      try {
        const o = 'nexus' + '.'
        for (let i = localStorage.length - 1; i >= 0; i--) {
          const k = localStorage.key(i)
          if (k && k.startsWith(o)) { const n = 'drispro.' + k.slice(o.length); if (localStorage.getItem(n) === null) localStorage.setItem(n, localStorage.getItem(k)); localStorage.removeItem(k) }
        }
      } catch {}
      // apply theme before paint to avoid a flash
      try {
        const t = localStorage.getItem('drispro.theme') || 'system'
        const dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
        const l = localStorage.getItem('drispro.lang')
        if (l === 'en' || l === 'sq') document.documentElement.lang = l
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>DrisPRO ka nevojë për JavaScript. · DrisPRO needs JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
