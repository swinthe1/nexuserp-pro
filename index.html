<!doctype html>
<html lang="sq" suppressHydrationWarning>
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="description" content="NexusERP Pro — shitje, magazinë, blerje, prodhim, financë dhe paga në një vend." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="NexusERP" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2B59C3" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>NexusERP Pro</title>
    <script src="/nexus-config.js"></script>
    <script>
      // apply theme before paint to avoid a flash
      try {
        const t = localStorage.getItem('nexus.theme') || 'system'
        const dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
        const l = localStorage.getItem('nexus.lang')
        if (l === 'en' || l === 'sq') document.documentElement.lang = l
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>NexusERP Pro ka nevojë për JavaScript. · NexusERP Pro needs JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
