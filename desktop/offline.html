<!doctype html>
<html lang="sq"><head><meta charset="utf-8"><title>DrisPRO</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 15px/1.5 "Segoe UI", system-ui, sans-serif; color: #172033; background: #f4f6fa; }
  main { width: min(440px, 90vw); background: #fff; border: 1px solid #dfe4ee; border-radius: 14px; padding: 28px; }
  h1 { margin: 0 0 6px; font-size: 20px; } p { margin: 0 0 18px; color: #5a6478; }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  input { width: 100%; box-sizing: border-box; height: 40px; border: 1px solid #c9d1e0; border-radius: 8px; padding: 0 12px; font: inherit; }
  .row { display: flex; gap: 8px; margin-top: 16px; }
  button { height: 40px; padding: 0 16px; border-radius: 8px; border: 1px solid #c9d1e0; background: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  button.primary { background: #2B59C3; border-color: #2B59C3; color: #fff; }
  #msg { margin-top: 12px; font-size: 13px; color: #b42318; min-height: 1em; }
</style></head>
<body><main>
  <h1>Serveri nuk u arrit</h1>
  <p>Kompjuteri nuk ka internet, ose adresa e serverit nuk është e saktë. Kur DrisPRO hapet një herë me internet, pastaj punon edhe pa lidhje.</p>
  <label for="server">Adresa e serverit</label>
  <input id="server" spellcheck="false">
  <div class="row"><button class="primary" id="retry">Provo përsëri</button><button id="save">Ruaj adresën</button></div>
  <div id="msg"></div>
</main>
<script>
  const q = new URLSearchParams(location.search)
  const input = document.getElementById('server'); input.value = q.get('server') || 'https://erp.dris-ks.com'
  document.getElementById('retry').onclick = () => window.drisproDesktop.retry()
  document.getElementById('save').onclick = async () => {
    try { await window.drisproDesktop.setServer(input.value.trim()) } catch (e) { document.getElementById('msg').textContent = String(e.message || e).replace(/^Error invoking remote method '[^']+': (Error: )?/, '') }
  }
</script>
</body></html>
